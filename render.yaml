services:
  - type: web
    name: splitsmart-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
